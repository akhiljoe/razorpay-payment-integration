# Pre-commit hooks. Install:
#
#     pipx install pre-commit && pre-commit install
#
# Runs on every commit; same hooks re-run in CI via .github/workflows/pr-checks.yml.
# Slow checks (mypy, pytest, cdk synth) live in CI only; pre-commit stays sub-5-second.

default_language_version:
  python: python3.11

default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        exclude: ^packages/checkout-widget/(node_modules|dist|tsconfig\.json)
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff format

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        name: markdownlint (designs/, docs/)
        args: [--disable, MD013, MD033, MD041, MD024, --]
        files: ^(designs|docs)/.*\.md$
