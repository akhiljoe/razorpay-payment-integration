[project]
name = "razorpay-checkout-infra"
version = "0.0.0"
description = "CDK infrastructure for the Razorpay payment integration"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.150,<3",
    "constructs>=10.3,<11",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<0.8",
    "mypy>=1.11,<2",
    "pytest>=8,<9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["app.py", "stacks"]
