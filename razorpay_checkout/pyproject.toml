[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "razorpay_checkout"
version = "0.0.0"
description = "Razorpay payment integration module"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.120",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "asyncpg>=0.29,<0.31",
    "httpx>=0.27,<0.29",
    "structlog>=24.1,<25",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "mangum>=0.17,<0.20",
    "alembic>=1.13,<2",
    "boto3>=1.34,<2",
    "aioboto3>=13.0,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=5,<6",
    "respx>=0.21,<0.23",
    "ruff>=0.6,<0.8",
    "mypy>=1.11,<2",
    "types-boto3>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["razorpay_checkout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "T20", "RET"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
files = ["razorpay_checkout"]

[tool.coverage.run]
source = ["razorpay_checkout"]
branch = true
